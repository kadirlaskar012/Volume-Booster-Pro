<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Small Promo Tile (440x280)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 440px;
      height: 280px;
      min-width: 440px;
      max-width: 440px;
      min-height: 280px;
      max-height: 280px;
      overflow: hidden;
      background: #080914;
      color: #FFFFFF;
      position: relative;
    }

    /* Ambient Glows */
    .glow-cyan {
      position: absolute;
      top: -60px;
      left: -40px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.35) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .glow-purple {
      position: absolute;
      bottom: -60px;
      right: -30px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .glow-pink {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.14) 0%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Subtle Grid Pattern */
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Card Layout */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 24px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    /* Brand Header with Icon & PRO Chip */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(139, 92, 246, 0.25));
      border: 1.5px solid rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 30%, #E0E7FF 70%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pro-badge {
      font-size: 9.5px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 5px;
      background: linear-gradient(135deg, #6C63FF, #06B6D4);
      color: #FFFFFF;
      -webkit-text-fill-color: #FFFFFF;
      letter-spacing: 0.08em;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.5);
    }

    /* Central Overdrive Badge */
    .center-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      margin: 2px 0;
    }

    .overdrive-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 99px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.18), rgba(245, 158, 11, 0.18));
      border: 1.5px solid rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
    }

    .overdrive-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #FDE047, #F59E0B, #EF4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 11.5px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 0.01em;
    }

    /* Bottom Feature Chips Row */
    .chips-row {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 700;
      color: #CBD5E1;
      backdrop-filter: blur(8px);
    }

    .chip-highlight {
      border-color: rgba(6, 182, 212, 0.4);
      color: #38BDF8;
      background: rgba(6, 182, 212, 0.08);
    }
  </style>
</head>
<body>

  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>
  <div class="glow-pink"></div>
  <div class="grid-lines"></div>

  <div class="container">
    <!-- Brand Header -->
    <div class="brand-row">
      <div class="icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="speaker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="url(#speaker-grad)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="url(#speaker-grad)" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="url(#speaker-grad)" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-title">
        Volume Booster
        <span class="pro-badge">PRO</span>
      </div>
    </div>

    <!-- Center Hero -->
    <div class="center-hero">
      <div class="overdrive-pill">
        <span style="font-size: 14px;">⚡</span>
        <span class="overdrive-text">Boost Volume Up to 600%</span>
      </div>
      <p class="tagline">Crystal-Clear Amplification & Studio Equalizer</p>
    </div>

    <!-- Bottom Feature Chips -->
    <div class="chips-row">
      <div class="feature-chip chip-highlight">🌙 Normalizer</div>
      <div class="feature-chip chip-highlight">🗣️ Clear Voice</div>
      <div class="feature-chip">⏰ Sleep Timer</div>
      <div class="feature-chip">🔊 +15dB Bass</div>
    </div>
  </div>

</body>
</html>
